services:
  - type: web
    name: django-todo
    runtime: python
    plan: free
    rootDir: todo_project
    buildCommand: pip install -r ../requirements.txt && python manage.py collectstatic --noinput
    # Free instances have no persistent disk: the database is recreated (and
    # the demo data re-seeded) every time the service starts.
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn todo_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SQLITE_PATH
        value: /tmp/db.sqlite3
