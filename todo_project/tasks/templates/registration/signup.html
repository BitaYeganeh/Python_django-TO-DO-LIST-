{% extends 'base.html' %}
{% block title %}Sign up · My To-Do App{% endblock %}

{% block content %}
<section class="card card--narrow">
  <h1 class="card__title">Create your account</h1>
  <p class="card__meta">Free, and only takes a few seconds.</p>

  <form method="post" class="auth-form">
    {% csrf_token %}
    {% include 'registration/_form_fields.html' %}
    <button type="submit" class="btn btn--primary btn--block">Sign up</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
